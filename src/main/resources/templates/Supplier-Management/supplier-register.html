<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Add Supplier</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Registration form (sends the data to /suppliers/register) -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 border-warning">
                    <h3 class="mb-4 text-warning"><i class="fa-solid fa-truck me-2"></i>Add New Supplier</h3>
                    <form th:action="@{/suppliers/register}" method="post" enctype="multipart/form-data">
                        <!-- Supplier name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Supplier Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
