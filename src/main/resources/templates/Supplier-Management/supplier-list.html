<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Manage Suppliers</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page title and Add Supplier button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Supplier Management</h2>
            <div>
                <a th:href="@{/suppliers/register}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Supplier</a>
            </div>
        </div>

        <!-- Search Form -->
        <div class="card mb-4 p-3 bg-light">
            <form th:action="@{/suppliers}" method="get" class="d-flex">
                <input class="form-control me-2" type="search" name="search" th:value="${searchQuery}" placeholder="Search by name or brand...">
                <button class="btn btn-outline-primary" type="submit">Search</button>
                <a th:if="${searchQuery != null}" th:href="@{/suppliers}" class="btn btn-outline-secondary ms-2">Clear</a>
            </form>
        </div>

        <!-- Supplier table with column headings -->
        <div class="table-responsive">
            <table class="table table-hover bg-white rounded shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Supplier Name</th>
                        <th>Contact</th>
                        <th>Brands</th>
                        <th>Type</th>
                        <th>Est. Delivery Time</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
