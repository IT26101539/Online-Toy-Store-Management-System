<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Edit Supplier</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Edit form (sends the data to /suppliers/edit/{id}) -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="mb-4">Edit Supplier: <span class="text-primary" th:text="${supplier.name}"></span></h3>
                    <form th:action="@{/suppliers/edit/{id}(id=${supplier.id})}" method="post" enctype="multipart/form-data">
                        <!-- Shows the current logo -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Current Logo</label>
                            <div class="mb-2">
                                <img th:src="${supplier.getImageUrl()}" 
                                     alt="Supplier Logo" 
                                     class="rounded border shadow-sm"
                                     style="height: 100px; width: 140px; object-fit: cover;"
                                     onerror="this.src='/images/placeholder-supplier.svg'">
                            </div>
                            <!-- Optional new logo upload -->
                            <label class="form-label fw-bold">Replace Logo <span class="text-muted fw-normal">(Optional &mdash; JPG, PNG, WEBP, max 5MB)</span></label>
                            <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
                        </div>
