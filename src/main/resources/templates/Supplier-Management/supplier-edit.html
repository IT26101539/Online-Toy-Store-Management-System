<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Edit Supplier</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Edit form (sends the data to /suppliers/edit/{id}) -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="mb-4">Edit Supplier: <span class="text-primary" th:text="${supplier.name}"></span></h3>
                    <form th:action="@{/suppliers/edit/{id}(id=${supplier.id})}" method="post" enctype="multipart/form-data">
