<!DOCTYPE html>
<!-- Standard HTML5 document type declaration -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<!--
  - xmlns:th -> Enables Thymeleaf attributes inside HTML tag.
  - xmlns:layout -> Enables Thymeleaf Layout Dialect to reuse a common layout structure.
  - layout:decorate -> Uses 'common/layout.html' template as the main wrapper page.
-->

<head>
    <!-- Page title displayed in browser tab -->
    <title>Login - ToysLanka</title>
</head>
<body>
     <!-- Main content fragment that injects into the common layout template -->
     <div layout:fragment="content">

         <!-- Outer container row centered horizontally with vertical padding (py-4) -->
         <div class="row justify-content-center py-4">

             <!-- Defines responsive grid column width (medium:6 cols,large:5 cols) -->
             <div class="col-md-6 col-lg-5">

                 <!-- Main Login Card Box with border styling,padding and subtle shadow -->
                 <div class="card p-4 p-md-5 shadow-sm border-0" style="border: 3px solid #FFE29A !important;">
                 </div>
             </div>
         </div>
     </div>
</body>
</html>
