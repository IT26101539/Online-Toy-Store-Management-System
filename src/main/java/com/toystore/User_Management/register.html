<!DOCTYPE html>
<!-- HTML5 document type declaration -->
<!-- Define the root HTML element and declare namespaces for Thymeleaf and Thymeleaf Layout Dialect -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <!-- Page title shown in browser tab -->
    <title>Create Account - ToysLanka</title>
</head>
<body>

<!-- Main content fragment that will be inserted into the master layout template -->
    <div layout:fragment="content">

        <!-- Bootstrap grid row:Centers the card horizontally with top and bottom padding -->
        <div class="row justify-content-center py-4">

            <!-- Column size: 7 columns on medium screens,6 columns on large screens -->
            <div class="col-md-7 col-lg-6">

                <!-- Main card wrapper for registration form with padding,shadow and custom border color -->
                <div class="card p-4 p-md-5 shadow-sm border-0" style="border: 3px solid #FFE29A !important;">

                    <!-- Header section containing welcome emojis,main title and sub-title -->
                    <div class="text-center mb-4">
                        <!-- Emojis displayed with large font size -->
                        <div class="fs-1 mb-2">🎪🌟</div>

                        <!-- Main heading title -->
                        <h2 class="fw-bold text-dark">Join the ToysLanka Family!</h2>

                        <!-- Subtitle text encouraging users to sign up -->
                        <p class="text-secondary fw-semibold">Sign up to buy awesome toys & track your orders</p>
                    </div>

                    <!-- Registration Form -->
                    <!-- th:action="@{/users/register}" -> Thymeleaf attribute that dynamically generates the POST submit URL -->
                    <!-- method="post" -> Sends form data securely to backend server -->
                    <form th:action="@{/users/register}" method="post">

                        <!-- Username Field Group -->
                        <div class="mb-3">
                            <!-- Label with FontAwesome user icon -->
                            <label for="username" class="form-label fw-bold"><i class="fa-solid fa-user me-1 text-primary"></i> Username</label>
                            <!-- Text input field for Username -->
                            <!-- name="username" -> Key name sent to Spring Boot backend controller -->
                            <!-- required -> Browser validation: User cannot leave this empty -->
                            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a friendly username" required>
                        </div>

                        <!-- Email Address Field Group -->
                        <div class="mb-3">
                            <!-- Label with FontAwesome envelope icon -->
                            <label for="email" class="form-label fw-bold"><i class="fa-solid fa-envelope me-1 text-primary"></i> Email Address</label>
                            <!-- Email input field (validates email format like user@domain.com) -->
                            <!-- name="email" -> Key name sent to backend controller -->
                            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. kamal@gmail.com" required>
                        </div>

                        <!-- Password Field Group -->
                        <div class="mb-3">
                            <!-- Label with FontAwesome lock icon -->
                            <label for="password" class="form-label fw-bold"><i class="fa-solid fa-lock me-1 text-primary"></i> Password</label>
                            <!-- Password input field (masks characters with dots/asterisks for security) -->
                            <!-- name="password" -> Key name sent to backend controller -->
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                        </div>
                    </form>
                </div>
    </div>
    </div>
    </div>
    </div>
