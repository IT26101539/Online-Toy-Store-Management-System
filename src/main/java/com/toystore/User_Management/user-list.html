<!DOCTYPE html>
<!-- Declare Thymeleaf and Thymeleaf Layout Dialect namespaces -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <!-- Page title:This text appears in the browser tab -->
    <title>User List</title>
</head>
<body>
<!-- Main content block:This replaces the 'content' placeholder in the main layout file (common/layout.html) -->
<div layout:fragment="content">

    <!-- Page main heading -->
    <h2 class="mb-4">Manage Users</h2>

    <!-- Main Card container to give a clean box design with interior padding -->
    <div class="card p-4">

        <!-- Makes the table horizontally scrollable on smaller screens (like mobile devices) -->
        <div class="table-responsive">

            <!-- Bootstrap table with zebra striping (striped) and row highlighting on mouse hover (hover) -->
            <table class="table table-striped table-hover">

                <!-- Table header row: Defines column titles -->
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <!-- Table body:Holds dynamic rows generated by Thymeleaf -->
                <tbody>
                <!-- Loop logic:Iterates through each 'user' item in the 'users' list sent by Spring Boot Controller -->
                <tr th:each="user :${users}">

                    <!-- Column 1:Print the User ID -->
                    <td th:text="${user.id}"></td>

                    <!-- Column 2:Print the Username -->
                    <td th:text="${user.username}"></td>

                    <!-- Column 3:Print the User Email -->
                    <td th:text="${user.email}"></td>
                    <!-- Column 4:Display the User Role wrapped inside a stylized Bootstrap badge -->
                    <td><span class="badge bg-info" th:text="${user.role}"></span></td>

                    <!-- Column 5:Action buttons (Delete action) -->
                    <td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
