<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Edit Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 border-primary">
                <div class="text-center mb-4">
                    <h2 class="text-primary">Edit Admin</h2>
                </div>
                <form th:action="@{/admin/edit/{id}(id=${admin.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" th:value="${admin.username}" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email address</label>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${admin.email}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Permissions</label>
                        <select class="form-select" name="permissions">
                            <option value="ALL" th:selected="${admin.permissions == 'ALL'}">Full Access (Super Admin)</option>
                            <option value="READ_ONLY" th:selected="${admin.permissions == 'READ_ONLY'}">Read Only</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Update Admin</button>
                        <a th:href="@{/admin/list}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
